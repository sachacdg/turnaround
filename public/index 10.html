<title>Turnaround (prototype)</title>
<style>
:root{--p:#2d2d31;--p2:#25252a;--ln:#47474d;--tx:#fff;--mu:#a3a3ab;--bl:#2f9bff;--gr:#2fd05a;--rd:#f0443a;--am:#ffa726;--nv:#25407a;--cy:#4fe3d0;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:linear-gradient(180deg,#4a4a4f 0%,#2b2b2f 45%,#151517 100%) fixed;color:var(--tx);font:15px/1.4 -apple-system,system-ui,'Segoe UI',Roboto,sans-serif}
#app{display:flex;flex-direction:column;height:100%}
#top{display:flex;align-items:center;gap:12px;padding:8px 14px;background:#1d1d20cc}
#top .tl,#top .tr{display:flex;align-items:center;gap:10px;flex:1}#top .tr{justify-content:flex-end}#top img{width:32px;height:32px;border-radius:9px}
#clk{font-variant-numeric:tabular-nums;font-weight:700;color:#cfd2d8}
.fc{text-align:center;border:2px solid #fff;border-radius:8px;padding:2px 14px;font-weight:700;letter-spacing:.3px}.fc small{display:block;font-weight:400;color:var(--mu);font-size:10px}
.ib{background:none;border:0;color:#e6e8ec;padding:4px;display:inline-flex}.ib svg{width:24px;height:24px}
#main{flex:1;overflow:auto;padding:12px}
#bar{display:flex;gap:6px;padding:6px 10px;background:#1d1d20e6}#bar .tabs{display:flex;flex:1;background:#3a3a40;border-radius:12px;padding:3px;gap:2px;overflow-x:auto}
#bar button{flex:1;min-width:68px;background:none;border:0;border-radius:10px;color:#cfd2d8;padding:6px 2px;font-size:11px;font-weight:600}
#bar button.on{background:#e9ebef;color:#16181c}#bar .pl{flex:0 0 58px;background:#3a3a40;border-radius:12px}
svg.ic{width:23px;height:23px;display:block;margin:0 auto 2px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.card{background:var(--p);border-radius:10px;padding:14px;margin-bottom:12px}
.g3{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:12px;margin-bottom:12px}
.pn{background:var(--p);border-radius:6px;overflow:hidden}.pn h3{margin:0;background:var(--nv);padding:10px 12px;font-size:13px;letter-spacing:.7px;text-transform:uppercase;display:flex;justify-content:space-between;align-items:center}.pn h3 svg{width:16px;height:16px;fill:none;stroke:#fff;stroke-width:2}.pb{padding:10px 12px}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}

/* historique des vols : inbound / rotation */
function histUp(o){const H=S.db.hist||(S.db.hist=[]),k=o.no+o.date,e={k,no:o.no,reg:o.reg,d:o.d,a:o.a,stdMs:o.stdMs,staMs:o.staMs,pax:o.w.pax},i=H.findIndex(x=>x.k==k);if(i>=0)H[i]=e;else H.push(e);H.sort((a,b)=>a.stdMs-b.stdMs);while(H.length>40)H.shift()}
function prevFlight(){const o=S.ofp;if(!o)return null;let best=null;(S.db.hist||[]).forEach(x=>{if(x.k!=o.no+o.date&&x.reg==o.reg&&x.a==o.d&&x.staMs<=o.stdMs&&o.stdMs-x.staMs<864e5&&(!best||x.staMs>best.staMs))best=x});return best}
function inbKv(){const p=prevFlight(),k=(a,b)=>`<div><span>${a}</span><b>${b}</b></div>`;if(!p)return k(t('esc'),'—')+k(t('num'),'—')+k(t('est'),'—')+k(t('ttm'),'—')+k(t('paxh'),'—');return k(t('esc'),p.d)+k(t('num'),p.no)+k(t('est'),hz(hmM(p.staMs))+'Z')+k(t('ttm'),Math.round((S.ofp.stdMs-p.staMs)/60000)+' min')+k(t('paxh'),p.pax)}
function rotHtml(){const o=S.ofp,p=prevFlight(),row=(l,x)=>`<tr><td>${l}</td><td>${x}</td></tr>`,f=(n,a,b,c,d,r)=>`${n} · ${a}→${b} · ${hz(hmM(c))}Z → ${hz(hmM(d))}Z · ${r}`;
return `<table>${row(t('prevl'),p?f(p.no,p.d,p.a,p.stdMs,p.staMs,p.reg)+' · '+p.pax+' pax':'—')}${row(t('rotl'),f(o.no,o.d,o.a,o.stdMs,o.staMs,o.reg))}</table><p style="margin-bottom:0"><label class=lb2>${t('nextd')}</label><input value="${esc(S.nextDest)}" maxlength=4 style="width:110px;text-transform:uppercase" placeholder="ICAO" onchange="setNext(this.value)"> <span class=mu>${S.nextNS?t('nonsch'):t('sch')}</span> <button class="btn sm" onclick="reStand()">${t('restand')}</button></p>`}
function setNext(v){S.nextDest=v.trim().toUpperCase();if(S.nextDest.length==4)S.nextNS=isNS(S.nextDest);render()}
/* step climbs */
function steps(o){const out=[];let cur=0;o.nav.forEach(r=>{if(r.st=='DSC'||r.fl<=0)return;if(!cur){if(r.st!='CLB')cur=r.fl;return}if(r.fl>cur){out.push({id:r.id,fl:r.fl,tt:r.tt});cur=r.fl}});return out}
const stepTxt=o=>{const s=steps(o);return s.length?s.map(x=>'FL'+x.fl+'@'+x.id).join(' '):'—'};
const stepAt=r=>S.ofp&&steps(S.ofp).some(s=>s.id==r.id&&s.tt==r.tt);
function stepStrip(){const o=S.ofp,s=steps(o);return `<p style="margin:0 0 8px"><b>${t('stpl')}</b> ${s.length?s.map(x=>`<span class=ch style="margin-left:6px;color:var(--am)">↗ FL${x.fl} · ${x.id} · ${hz(hmM(o.offMs+x.tt*1000))}Z</span>`).join(''):`<span class=mu>${t('stpn')}</span>`}</p>`}
function snap(){const set={};SK.forEach(k=>set[k]=S[k]);set.cid=S.viff.cid;delete set.viffApiKey;delete set.apiKey;const ac={};for(const k in S.db.ac)if(k!='—')ac[k]=S.db.ac[k];return JSON.stringify({set,db:{ac,rep:S.db.rep,notes:S.db.notes||{},duty:S.db.duty||{},hist:S.db.hist||[],rls:S.db.rls||{}}})}
/* sync with diagnostic */
async function syn(){if(!S.sbu){S.msg=t('needsb');render();return}S.msg=t('syncing');render();try{const j=await sbFetch(S.sbu),fx=navFixes(j);S.diag={times:j.times||null,fix:fx[1]||fx[0]||null,navCount:fx.length,keys:Object.keys(j)};load(parseOFP(j))}catch(e){S.msg=t('syncerr');render()}}
/* aircraft acceptance with signature */
function acBtn(open){const gx=S.sg.ac&&S.sg.ac.reg==FL.reg;return gx?`<span class="ch ok">✓ ${t('accd')} · ${hz(S.sg.ac.t)}Z</span> <img class=sg src="${S.sg.ac.img}" style="width:110px;margin:0 8px" alt=""> <button class="btn sm" onclick="op('ac')">${t('again')}</button>`:`<button class="btn p" ${open?'disabled':''} onclick="op('ac')">${t('accept')}</button>`}
function ad(){const v=$('#ds').value.trim();if(!v)return;const n=S.tl.length+1;S.tl.unshift({id:'TL-'+String(n).padStart(4,'0'),wo:'WO.'+(1000000+n),ata:$('#at').value.slice(0,2)+'-xx',d:v,st:'OPEN',b:'Pilot',op:new Date().toISOString().slice(0,10)});S.sg.ac=null;render()}
/* crew */
function V_crew(){const o=S.ofp;if(!o)return `<div class="card mu">${t('nocrew')}</div>`;if(!S.crew)S.crew=mkCrew();const c=S.crew,ts=tsvLeft(),
m=(r,col,p,isCab=false)=>`<div class=card style="padding:0;overflow:hidden;margin:0"><div style="background:${col};padding:5px 12px;font-weight:700;color:#fff;display:flex;justify-content:flex-end;align-items:center">${r}</div><div class=cr><svg viewBox="0 0 24 24"><path d="${IC.user}"/></svg><div style="flex:1;min-width:0"><b>${esc(p.n)}</b><div class=mu>${t('langs')} : ${p.lg.join(', ')}</div></div>${isCab?'':`<div style="text-align:right;flex-shrink:0"><span class=lb>TSV</span><b style="font-size:18px">${ts}</b></div>`}</div></div>`;
return `<div style="margin-bottom:12px"><b>${t('pnc')} : ${c.cab.length}</b> <span class=mu>(${S.ls[0]} pax)</span><div class=mu>${t('stddur')}</div><div class=mu>${t('tsvl')}</div></div><div class=g3>${m(t('cdb'),'var(--nv)',c.cpt)}${m(t('opl'),'var(--nv)',c.fo)}${c.cab.map((p,i)=>m(i?t('hst'):t('cct'),'#6b5a3e',p,true)).join('')}</div>`}
/* settings in collapsible panels */
function so(k){S.so[k]=!S.so[k];render()}
function ulgT(l){const a=S.ulang,i=a.indexOf(l);i<0?a.push(l):a.splice(i,1);S.crew=null;render()}
function V_set(){const v=S.viff,seg=(a,b,f,cur)=>`<span class=seg><button class="${cur?'on':''}" onclick="${f[0]}">${a}</button><button class="${cur?'':'on'}" onclick="${f[1]}">${b}</button></span>`,col=(k,l)=>`<div><label>${t(l)}</label><input type=color value="${S.th[k]}" oninput="thSet('${k}',this.value)" style="width:100%;padding:2px;height:44px"></div>`,
sec=(k,title,body)=>`<div class=card style="padding:0"><button class="acc${S.so[k]?' on':''}" onclick="so('${k}')"><span>${title}</span><svg viewBox="0 0 24 24"><path d="${IC.chv}"/></svg></button>${S.so[k]?`<div class=accb>${body}</div>`:''}</div>`,
dg=S.diag?`<pre class=mono style="white-space:pre-wrap;font-size:11px;margin:8px 0 0">${esc(JSON.stringify(S.diag.times).slice(0,600))}</pre>`:`<p class=mu>${t('diagn')}</p>`;
return sec('acc',t('accS'),`<p class=mu>${esc(S.user||'')} · ${Store.mode=='server'?t('msrv'):t('mloc')}</p><p><span class=seg><button class="${S.lang=='fr'?'on':''}" onclick="S.lang='fr';render()">FR</button><button class="${S.lang=='en'?'on':''}" onclick="S.lang='en';render()">EN</button></span></p><p class=mu>${t('utcn')}</p><p><button class=btn onclick="logout()">${t('lo')}</button></p>`)
+sec('pro',t('proS'),`<p>${seg(t('cptl'),t('fol'),["S.side='cpt';S.crew=null;render()","S.side='fo';S.crew=null;render()"],S.side=='cpt')}</p><div class=fgs><div><label>${t('uname')}</label><input value="${esc(S.uname)}" onchange="S.uname=this.value;S.crew=null"></div></div><p class=mu style="margin:12px 0 6px">${t('ulg')}</p><p>${['FR','EN','NL','DE','ES','IT','PT','AR','PL'].map(l=>`<button class="btn sm${S.ulang.includes(l)?' p':''}" style="margin:0 6px 6px 0" onclick="ulgT('${l}')">${l}</button>`).join('')}</p>`)
+sec('con',t('conS'),`<b>SimBrief</b><div class=fgs style="margin:8px 0"><div><label>${t('sbu')}</label><input value="${esc(S.sbu)}" onchange="S.sbu=this.value.trim()"></div></div><p><button class="btn p" onclick="syn()">${t('syncnow')}</button></p><hr style="border:0;border-top:1px solid var(--ln);margin:14px 0"><b>VATSIM / vIFF</b><div class=fgs style="margin:8px 0"><div><label>${t('vcid')}</label><input value="${esc(v.cid)}" onchange="S.viff.cid=this.value.trim()"></div></div><p class=mu>${t('vnote')}</p><p><button class=btn onclick="viffPoll()">${t('sync')}</button> <button class=btn onclick="vdgs()">${t('vdgsl')}</button> ${S.viffSt=='ok'?ch('✓ vIFF','ok'):S.viffSt=='off'?ch('vIFF ✕','wn'):''}</p><hr style="border:0;border-top:1px solid var(--ln);margin:14px 0"><b>${t('diag')}</b>${dg}`)
+sec('app',t('appS'),`<div class=fgs>${col('nv','cnv')}${col('bl','cbl')}${col('bg1','cbg1')}${col('bg2','cbg2')}${col('p','cp')}</div><p class=mu style="margin:12px 0 6px">${t('cpre')}</p><p>${PRE.slice(-2).map((x,i)=>`<button class="btn sm" style="margin:0 6px 6px 0" onclick="thP(${PRE.length-2+i})">${L2(x.n)}</button>`).join('')}</p>`)
+sec('doc',t('docS'),`<div class=fgs><div><label>${t('bico')}</label><input id=bki maxlength=4 style="text-transform:uppercase" placeholder="LFPG"></div><div><label>${t('bfile')}</label><input id=bkf type=file accept="application/pdf,.pdf"></div></div><p><button class="btn p" onclick="bkAdd()">${t('badd')}</button></p>${S.briefs.length?S.briefs.map(a=>`<span class=ch style="margin:0 8px 6px 0">${a} <button class="btn sm" style="min-height:24px;padding:0 8px;margin-left:6px" onclick="bkDel('${a}')">×</button></span>`).join(''):`<p class=mu>${t('bnone')}</p>`}<div class=fgs style="margin-top:8px"><div><label>${t('eosd')}</label><input value="${esc(S.eos)}" placeholder="https://blackbox711.com/airport-info-charts.html" onchange="S.eos=this.value.trim()"></div></div>`)
+sec('gat',t('gatS'),`<p><button class=btn onclick="S.sm2='stands';render()">${t('standt')}</button></p>`)}
document.head.appendChild(Object.assign(document.createElement('style'),{textContent:`.acc{width:100%;display:flex;justify-content:space-between;align-items:center;background:none;border:0;color:var(--tx);padding:16px;font-size:16px;font-weight:700;text-align:left}.acc svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;transition:transform .2s;flex-shrink:0}.acc.on svg{transform:rotate(90deg)}.accb{padding:0 16px 16px;animation:fade .2s}.stp{color:var(--am)!important;font-weight:700}`}));

applyTheme();render();

</script></body></html>
