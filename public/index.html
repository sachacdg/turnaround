<title>Turnaround (prototype)</title>
<style>
:root{--p:#2d2d31;--p2:#25252a;--ln:#47474d;--tx:#fff;--mu:#a3a3ab;--bl:#2f9bff;--gr:#2fd05a;--rd:#f0443a;--am:#ffa726;--nv:#25407a;--cy:#4fe3d0;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:linear-gradient(180deg,#4a4a4f 0%,#2b2b2f 45%,#151517 100%) fixed;color:var(--tx);font:15px/1.4 -apple-system,system-ui,'Segoe UI',Roboto,sans-serif}
#app{display:flex;flex-direction:column;height:100%}
#top{display:flex;align-items:center;gap:12px;padding:8px 14px;background:#1d1d20cc}
#top .tl,#top .tr{display:flex;align-items:center;gap:10px;flex:1}#top .tr{justify-content:flex-end}#top img{width:32px;height:32px;border-radius:9px}
#clk{font-variant-numeric:tabular-nums;font-weight:700;color:#cfd2d8}
.fc{text-align:center;border:2px solid #fff;border-radius:8px;padding:2px 14px;font-weight:700;letter-spacing:.3px}.fc small{display:block;font-weight:400;color:var(--mu);font-size:10px}
.ib{background:none;border:0;color:#e6e8ec;padding:4px;display:inline-flex}.ib svg{width:24px;height:24px}
#main{flex:1;overflow:auto;padding:12px}
#bar{
  display:flex;
  gap:6px;
  padding:6px 10px calc(6px + env(safe-area-inset-bottom));
  margin-bottom:calc(-1 * env(safe-area-inset-bottom));
  background:#1d1d20e6;
  flex-shrink:0;
}#bar .tabs{display:flex;flex:1;background:#3a3a40;border-radius:12px;padding:3px;gap:2px;overflow-x:auto}
#bar button{flex:1;min-width:68px;background:none;border:0;border-radius:10px;color:#cfd2d8;padding:6px 2px;font-size:11px;font-weight:600}
#bar button.on{background:#e9ebef;color:#16181c}#bar .pl{flex:0 0 58px;background:#3a3a40;border-radius:12px}
#bar{
  transition:background .2s;
}
body.nav-floating #bar{
  background:transparent!important;
}
body.nav-floating #bar .tabs{
  background:transparent!important;
}
body.nav-floating #bar .pl{
  background:var(--nv)!important;
  color:#fff!important;
}
body.nav-floating #bar .pl.on{
  background:#fff!important;
  color:#16181c!important;
}
body.nav-floating #bar button{
  background:var(--nv);
  color:#fff;
  border-radius:12px;
  margin:0 3px;
  box-shadow:0 2px 6px #0002;
}
body.nav-floating #bar button.on{
  background:#fff!important;
  color:#16181c!important;
}
svg.ic{width:23px;height:23px;display:block;margin:0 auto 2px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.card{background:var(--p);border-radius:10px;padding:14px;margin-bottom:12px}
.g3{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:12px;margin-bottom:12px}
.pn{background:var(--p);border-radius:6px;overflow:hidden}.pn h3{margin:0;background:var(--nv);padding:10px 12px;font-size:13px;letter-spacing:.7px;text-transform:uppercase;display:flex;justify-content:space-between;align-items:center}.pn h3 svg{width:16px;height:16px;fill:none;stroke:#fff;stroke-width:2}.pb{padding:10px 12px}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.nb{flex:1;min-width:120px;background:var(--nv);color:#fff;border:0;border-radius:6px;padding:11px 12px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;font-size:13px;display:flex;justify-content:space-between;align-items:center;gap:8px}.nb:disabled{background:#55575d;color:#aaa}.nb svg{width:15px;height:15px;fill:none;stroke:#fff;stroke-width:2}
.bd{background:#fff;color:#16181c;border-radius:99px;padding:0 7px;font-size:11px;font-weight:800}
.btn{background:#16181c;color:#fff;border:2px solid #e9ebef;border-radius:10px;min-height:44px;padding:0 18px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;font-size:13px}.btn.p{background:#e9ebef;color:#16181c}.btn:disabled{opacity:.35}.btn.sm{min-height:34px;padding:0 12px}
.ch{display:inline-block;border:1px solid;border-radius:99px;padding:1px 10px;font-weight:700;font-size:11px;background:#16181c}.ok{color:var(--gr)}.wn{color:var(--am)}.rd{color:var(--rd)}.bl{color:var(--bl)}.cy{color:var(--cy)}
table{width:100%;border-collapse:collapse}td,th{padding:7px 6px;border-bottom:1px solid var(--ln);text-align:left}th{font-size:11px;color:var(--mu);text-transform:uppercase}td.n{text-align:right;font-variant-numeric:tabular-nums}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:6px}.kv>div{background:var(--p2);border-radius:6px;padding:8px 10px;display:flex;justify-content:space-between;gap:8px}.kv span{color:var(--mu);font-size:12px}.kv b{text-align:right}
input,select,textarea{background:#16181c;color:#fff;border:1.5px solid var(--ln);border-radius:8px;padding:8px 10px;font:inherit;min-height:42px;max-width:100%}input[type=number]{width:96px}textarea{width:100%;min-height:90px}input:focus,select:focus,textarea:focus{outline:0;border-color:var(--bl)}
.big{font-size:30px;font-weight:800;letter-spacing:.5px}.mu{color:var(--mu)}.ban{border-radius:8px;padding:10px 14px;margin-bottom:12px;font-weight:700}.ban.rd{background:var(--rd);color:#fff}.ban.bl{background:var(--bl);color:#04121d}
.bk{background:#0e0f11;border-radius:4px;padding:6px 12px;font-weight:800;letter-spacing:1px;text-transform:uppercase;font-size:13px;margin:12px 0 8px}
.tiles{display:flex;gap:10px;flex-wrap:wrap}.tile{width:112px;border:1.5px solid;border-radius:4px;overflow:hidden;cursor:pointer;background:#fff;color:#fff;font-size:12px;font-weight:700;text-align:center}.tile i{display:block;height:74px;background:repeating-linear-gradient(180deg,#fff 0 6px,#cfd3d8 6px 8px)}.tile div{padding:6px 4px;min-height:52px;display:flex;align-items:center;justify-content:center}
.sg{background:#16181c;border-radius:8px;width:100%;max-height:90px;object-fit:contain;margin:6px 0}
.mdl{position:fixed;inset:0;background:#000b;display:flex;align-items:center;justify-content:center;z-index:9;padding:14px}.mb{background:var(--p);border-radius:14px;padding:16px;width:min(620px,100%)}
#pad{width:100%;height:auto;background:#16181c;border:2px solid var(--bl);border-radius:10px;touch-action:none}
.nt{background:var(--nv);border-radius:4px;padding:10px 12px 10px 52px;margin-bottom:10px;position:relative;font-family:ui-monospace,Menlo,monospace;font-size:13px}.nt:before{content:'';position:absolute;left:12px;top:12px;width:28px;height:28px;border:2px solid #aab;border-radius:50%}.nt small{position:absolute;right:12px;top:8px;color:#bcd}mark{background:#000;color:var(--rd);padding:0 3px;border-radius:3px}mark.a{color:var(--am)}
.seg{display:inline-flex;background:#16181c;border-radius:99px;margin-bottom:10px}.seg button{background:none;color:var(--mu);border:0;padding:7px 18px;border-radius:99px;font-weight:700}.seg button.on{background:var(--nv);color:#fff}
.tg{display:inline-block;background:#6c4bb5;color:#fff;border-radius:4px;padding:0 7px;font-size:11px;font-weight:700;margin-right:6px}
.sec{background:var(--p);border-radius:10px;margin-bottom:14px;overflow:hidden}.sec h4{margin:0;padding:12px 14px;background:var(--p2);display:flex;gap:10px;align-items:center}.sec h4 i{font-style:normal;width:24px;height:24px;border-radius:50%;background:var(--bl);color:#04121d;font-size:12px;display:flex;align-items:center;justify-content:center;font-weight:800}

<style id="inbound-ui-restoration">
/* Inbound: restore the individual grey information cells without changing the banner geometry. */
.bandg > .prov-card .prov-kv{display:grid;grid-template-columns:1fr;gap:5px;margin-top:7px}
.bandg > .prov-card .prov-kv > div{display:flex;align-items:center;justify-content:space-between;gap:10px;min-width:0;min-height:25px;padding:4px 8px;background:#34343a;border:1px solid #47474d;border-radius:4px;box-sizing:border-box}
.bandg > .prov-card .prov-kv > div span{color:#c0c0c7;white-space:nowrap}
.bandg > .prov-card .prov-kv > div b{color:#fff;text-align:right;overflow-wrap:anywhere}
[data-th=light] .bandg > .prov-card .prov-kv > div{background:#e9ebef;border-color:#d5d8de}
[data-th=light] .bandg > .prov-card .prov-kv > div span{color:#626975}
[data-th=light] .bandg > .prov-card .prov-kv > div b{color:#20242b}
</style>
<style id="editable-stands">.bandg .stand-row span[ondblclick]{cursor:pointer;border-radius:3px;padding:2px 3px}.bandg .stand-row span[ondblclick]:hover{background:var(--sf,rgba(128,128,128,.16));outline:1px dashed var(--mu)}</style>
<style id="arrival-time-alignment-fix">
/* Aligne les deux heures de la carte arrivée sur la même ligne de base. */
.bandg .arrival-card .arrival-row{align-items:flex-end}
.bandg .arrival-card .arrival-row .time-wrap{display:flex;flex-direction:column;justify-content:flex-end;min-height:56px}
.bandg .arrival-card .arrival-row .schedule-label{margin-top:0;min-height:12px;line-height:12px}
.bandg .arrival-card .arrival-row .main-time{line-height:1.05;margin-top:3px}
.bandg .arrival-card .arrival-row .gap-wrap{align-self:flex-end}
</style>

<style id="route-times-alignment">
/* Aligne les trois valeurs horaires du bandeau (CTOT, temps de vol, arrivée avant taxi-in) sur une même ligne. */
.bandg .route-head{align-items:start}
.bandg .route-head>span{display:flex;flex-direction:column;justify-content:flex-start;min-width:0}
.bandg .route-head>span:first-child{text-align:left}
.bandg .route-head>span:nth-child(2){text-align:center}
.bandg .route-head>span:last-child{text-align:right}
.bandg .route-head .ctot-tag{line-height:1.15;min-height:11.5px}
.bandg .route-head>span:nth-child(2),.bandg .route-head>span:last-child{line-height:1.15}
.bandg .route-head b{margin-top:3px;line-height:1.15}
</style>

<style id="route-arrival-value-baseline-fix">
/* Place l’heure d’arrivée sur la ligne des valeurs, et non sur celle des libellés. */
.bandg .route-head>span:last-child>b{display:block;margin-top:14.5px;line-height:1.15}
</style>

<style id="auth-loading-indicator">
.auth-loading{margin:13px 0 9px;padding:0 2px;animation:fadeUp .2s ease-out}
.auth-loading-text{font-size:12px;color:var(--mu);text-align:center;margin-bottom:7px}
.auth-loading-track{height:4px;width:100%;overflow:hidden;border-radius:99px;background:var(--ln,rgba(128,128,128,.22));position:relative}
.auth-loading-track span{display:block;position:absolute;left:-38%;top:0;height:100%;width:38%;border-radius:99px;background:#2f9bff;animation:auth-loading-slide 1.15s ease-in-out infinite}
@keyframes auth-loading-slide{0%{left:-38%}100%{left:100%}}
button:disabled{opacity:.65;cursor:wait}
</style>

async function bgImport(inp){
  const f=inp.files&&inp.files[0];
  if(!f)return;

  if(!f.type.startsWith('image/')){
    alert('Choisis un fichier image.');
    return;
  }

  const rd=new FileReader();

  rd.onload=()=>{
    const im=new Image();

    im.onload=()=>{
      const scale=Math.min(1,1600/im.width,1200/im.height);
      const c=document.createElement('canvas');

      c.width=Math.round(im.width*scale);
      c.height=Math.round(im.height*scale);

      c.getContext('2d').drawImage(im,0,0,c.width,c.height);

      S.bgImage=c.toDataURL('image/jpeg',0.95);
      try{
  localStorage.setItem('ta_bg_preview',S.bgImage);

      render();

    im.src=rd.result;
  };

e.innerHTML=`<div class=pvt><button class="btn sm" onclick="pvClose()">${t('closeb')}</button><b class=pvn>${esc(title)}</b><input id=pvs placeholder="${t('search')}" onkeydown="if(event.key=='Enter')pvFind(this.value)" style="width:150px"><span id=pvp style="opacity:.7"></span><button class="btn sm" onclick="pvZ(-.25)">−</button><button class="btn sm" onclick="pvZ(.25)">+</button><button id=pvb class="btn sm" onclick="pvPen()">${t('pnen')}</button><button class="btn sm" onclick="pvClr()">${t('clear')}</button></div><div id=pvc class=pvc><div style="padding:20px;opacity:.7">${t('lding')}</div></div>`;
try{if(src.img){$('#pvc').innerHTML=`<img src="${src.img}" alt="" style="max-width:100%;display:block;margin:auto;background:#fff">`;return}
const lib=await loadPdfjs(),data=src.blob?await src.blob.arrayBuffer():await fetchBytes(src.url);PV.doc=await lib.getDocument({data}).promise;await pvRender()}catch(x){pvClose();S.msg=t('pdfe');render()}}
async function pvRender(){const c=$('#pvc');if(!c||!PV.doc)return;c.innerHTML='';const dpr=window.devicePixelRatio||1;
for(let i=1;i<=PV.doc.numPages;i++){const pg=await PV.doc.getPage(i),vp=pg.getViewport({scale:PV.scale}),w=document.createElement('div');w.className='pvpg';w.dataset.p=i;w.style.width=vp.width+'px';w.style.height=vp.height+'px';const cv=document.createElement('canvas');cv.width=vp.width*dpr;cv.height=vp.height*dpr;cv.style.width=vp.width+'px';cv.style.height=vp.height+'px';w.appendChild(cv);const an=document.createElement('canvas');an.className='pvan';an.width=vp.width;an.height=vp.height;an.style.pointerEvents=PV.pen?'auto':'none';w.appendChild(an);c.appendChild(w);pvAnn(an,i);await pg.render({canvasContext:cv.getContext('2d'),viewport:vp,background:'#fff',transform:dpr!=1?[dpr,0,0,dpr,0,0]:null}).promise}
c.onscroll=pvInfo;pvInfo()}
function pvInfo(){const c=$('#pvc'),p=$('#pvp');if(!c||!p||!PV.doc)return;let cur=1;c.querySelectorAll('.pvpg').forEach(w=>{if(w.offsetTop-c.offsetTop<=c.scrollTop+40)cur=+w.dataset.p});p.textContent=t('pgl')+' '+cur+'/'+PV.doc.numPages}
function pvAnn(an,i){const k=PV.key+':'+i,x=an.getContext('2d');if(PV.ann[k]){const im=new Image();im.onload=()=>x.drawImage(im,0,0,an.width,an.height);im.src=PV.ann[k]}x.strokeStyle='rgba(255,196,0,.9)';x.lineWidth=3;x.lineCap='round';let on=0;const pt=e=>{const r=an.getBoundingClientRect();return[(e.clientX-r.left)*an.width/r.width,(e.clientY-r.top)*an.height/r.height]};
an.onpointerdown=e=>{on=1;an.setPointerCapture(e.pointerId);const p=pt(e);x.beginPath();x.moveTo(p[0],p[1])};an.onpointermove=e=>{if(!on)return;const p=pt(e);x.lineTo(p[0],p[1]);x.stroke()};an.onpointerup=()=>{on=0;PV.ann[k]=an.toDataURL()}}
function pvPen(){PV.pen=!PV.pen;document.querySelectorAll('.pvan').forEach(a=>a.style.pointerEvents=PV.pen?'auto':'none');$('#pvb').classList.toggle('on',PV.pen)}
function pvClr(){Object.keys(PV.ann).filter(k=>k.startsWith(PV.key+':')).forEach(k=>delete PV.ann[k]);document.querySelectorAll('.pvan').forEach(a=>a.getContext('2d').clearRect(0,0,a.width,a.height))}
async function pvZ(d){if(!PV.doc)return;PV.scale=Math.max(.6,Math.min(3,PV.scale+d));await pvRender()}
async function pvFind(q){q=(q||'').toLowerCase().trim();if(!q||!PV.doc)return;const n=PV.doc.numPages,p=$('#pvp');for(let k=1;k<=n;k++){const i=((+(p.textContent.match(/ (\d+)\//)||[0,1])[1]+k-1)%n)+1,tx=await (await PV.doc.getPage(i)).getTextContent();if(tx.items.map(x=>x.str).join(' ').toLowerCase().includes(q)){$('#pvc').querySelector('[data-p="'+i+'"]').scrollIntoView();return}}p.textContent=t('nores')}

function gsxBoardingSync(service){
  if(S.boardMode!=='gsx')return;
  const state=String(service&&service.state||'').toLowerCase();
  const status=String(service&&service.statusText||'');
  const progress=status.match(/\bpax\s+(\d+)\s*\/\s*(\d+)/i);
  let countChanged=false;
  if(progress){
    const boarded=Number(progress[1]),total=Number(progress[2]);
    if(Number.isFinite(boarded)&&Number.isFinite(total)&&total>=0){
      countChanged=S.bd!==boarded||S.gsxPaxTotal!==total;
      S.bd=Math.min(boarded,total);
      S.gsxPaxTotal=total;
    }
  }
  if(state==='performing' && S.brd!=='open'){
    S.brd='open';
    S.bt0=0;
    if(S.tab==='dash')render();
  }
  if(state==='completed' && S.brd==='open'){
    S.brd='closed';
    S.bt0=0;
    if(S.tab==='dash')render();
  }
  if(countChanged&&S.tab==='dash')paxUpd();
}
function ctotColor(){
  if(S.atotV)return '#2f9bff';
  if(!S.ctotV)return 'var(--am)';

  const m=String(S.ctotV).match(/^(\d{2}):(\d{2})$/);
  if(!m)return 'var(--am)';

  const target=Number(m[1])*60+Number(m[2]);
  const now=new Date();
  const current=now.getUTCHours()*60+now.getUTCMinutes();
  const diff=((current-target+720+1440)%1440)-720;

  return diff>=-5&&diff<=10
    ?'var(--gr)'
    :diff>10
      ?'var(--rd)'
      :'var(--am)';
}

<script>
/* Client GSX Remote API */
window.GSX = (() => {
  let ws = null;
  let active = false;
  let reconnectTimer = null;
  let ready = false;
  let running = false;
  let mirror = {};
  let messages = [];
  let commandNo = 0;
  let pendingId = null;
  let pendingTimer = null;
  let pendingCode = null;
  let lastServiceStates = {};

const SERVICE_MESSAGES = {
  boarding: {
    sent: "L’équipage est prêt, vous pouvez lancer l’embarquement.",
    accepted: "Nous transmettons le message à la porte.",
    started: "Embarquement démarré.",
    finished: "Embarquement clôturé.",
    refused: "Impossible pour le moment."
  },
  deboarding: {
    sent: "Demandons le débarquement.",
    accepted: "Nous transmettons à la porte.",
    started: "Débutons le débarquement.",
    finished: "Débarquement terminé.",
    refused: "Débarquement impossible."
  },
  fuel: {
    sent: "L’avion est sécurisé, les opérations d’avitaillement carburant peuvent débuter.",
    accepted: "Le camion est en route.",
    started: "Débutons l’avitaillement carburant.",
    finished: "Avitaillement terminé, bon vol ;)",
    refused: "Avitaillement indisponible."
  },
  catering: {
    sent: "Nous sommes prêts pour l’arrivée du catering.",
    accepted: "Les camions sont en route.",
    started: "Démarrons le restockage des galleys.",
    finished: "Opérations de catering terminées.",
    refused: "Catering indisponible."
  },
  stairs: {
    sent: "Vous pouvez opérer les rampes d’accès.",
    accepted: "Opération des rampes en cours.",
    started: "Positionnement des escaliers débuté.",
    finished: "Escaliers positionnés.",
    refused: "Escaliers indisponibles."
  },
  jetway: {
    sent: "Demandons l’opération de la passerelle.",
    accepted: "Opération de la passerelle en cours.",
    started: "Débutons l’opération de la passerelle.",
    finished: "Passerelle connectée/déconnectée.",
    refused: "Passerelle indisponible."
  },
  gpu: {
    sent: "Vous pouvez connecter le groupe.",
    accepted: "Connexion du groupe en cours.",
    started: "Plaçons le groupe.",
    finished: "Groupe connecté.",
    refused: "Groupe indisponible."
  },
  pushback: {
    sent: "Nous sommes prêts, freins serrés, vous pouvez placer le tracteur.",
    accepted: "Plaçons le tracteur.",
    started: "Levons l’appareil.",
    finished: "Tracteur placé, prêt au repoussage, sélectionnez la direction :",
    refused: "Tracteur indisponible."
  },
  cleaning: {
    sent: "Demandons le ménage cabine.",
    accepted: "Ménage en route.",
    started: "Démarrons le nettoyage cabine.",
    finished: "La cabine est propre, opération terminée.",
    refused: "Service ménage indisponible."
  }
};

  let messageNo = 0;

function log(text, isError = false, kind = 'received') {
  const message = {
    id: ++messageNo,
    time: new Date().toLocaleTimeString('fr-FR'),
    text: String(text),
    kind: isError ? 'error' : kind
  };

  messages.push(message);
  messages = messages.slice(-50);

  if (isError) {
    setTimeout(() => {
      messages = messages.filter(m => m.id !== message.id);
      if (S.sm2 === 'gsx') render();
    }, 10000);
  }

  if (S.sm2 === 'gsx') {
    render();
    const feed = document.querySelector('.piste-feed');
    if (feed) feed.scrollTop = feed.scrollHeight;
  }
}
function updateServiceStates(list, initial = false) {
  const nextStates = {};

  (Array.isArray(list) ? list : []).forEach(item => {
    const id = String(item.id || '').toLowerCase();
    const state = String(item.state || '').toLowerCase();

    if (!id) return;

    const previous = lastServiceStates[id];

    if (!initial && previous && previous !== state) {
      const code = {
        boarding: 'boarding',
        deboarding: 'deboarding',
        refueling: 'fuel',
        catering: 'catering',
        operatestairs: 'stairs',
        operatejetways: 'jetway',
        gpu: 'gpu',
        departure: 'pushback',
        cleaning: 'cleaning'
      }[id];

      const messages = SERVICE_MESSAGES[code];

      if (messages && state === 'performing') {
        log(messages.started);
      }

      if (messages && state === 'completed') {
        log(messages.finished);
      }
    }

    nextStates[id] = state;
  });

  lastServiceStates = nextStates;
  gsxBoardingSync((Array.isArray(list)?list:[]).find(item=>String(item.id||'').toLowerCase()==='boarding'));
}
  function connect() {
    active = true;

    if (ws && (ws.readyState === 0 || ws.readyState === 1)) return;

    clearTimeout(reconnectTimer);
    const host = (S.gsxHost || '192.168.1.62').trim();
    const port = (S.gsxPort || '8744').trim();
    const secureUrl = (S.gsxWss || '').trim();
    let socketUrl = `ws://${host}:${port}/`;

    if (secureUrl) {
      try {
        const parsed = new URL(secureUrl);
        if (parsed.protocol !== 'wss:' || parsed.username || parsed.password) throw new Error('Adresse WSS invalide');
        socketUrl = parsed.href;
      } catch (e) {
        log('Adresse WebSocket sécurisée invalide : utilisez une adresse wss://.', true);
        active = false;
        return;
      }
    }

    try {
      ws = new WebSocket(socketUrl);
    } catch (e) {
      log('Erreur WebSocket : ' + e.message, true);
      retry();
      return;
    }

    ws.onopen = () => log('Connexion réseau établie.');

    ws.onmessage = (event) => {
  let d;
  try { d = JSON.parse(event.data); }
  catch { return; }

  if (d.type === 'hello') {
    ready = d.protocol === 1;
    running = !!d.gsxRunning;

    if (ready) {
      ws.send(JSON.stringify({
        type: 'subscribe',
        channels: ['state']
      }));
      log(running ? 'GSX détecté.' : 'Serveur connecté, GSX arrêté.');
    }
  }

  if (d.type === 'snapshot') {
  mirror = d;
  updateServiceStates(mirror.services, true);
  log('État GSX reçu.');
  if (S.sm2 === 'gsx') render();
}
  if (d.type === 'patch') {
  const key = (d.path || '').replace(/^\/+/, '');

  if (key) {
    mirror[key] = d.value;

    if (key === 'services') {
      updateServiceStates(mirror.services);
    }
  }

  if (S.sm2 === 'gsx') render();
}

  if (d.type === 'event' && d.topic === 'engine') {
    running = !!d.gsxRunning;
    log(running ? 'GSX démarré.' : 'GSX arrêté.');
  }

  if (d.type === 'result') {
  if (String(d.id) === String(pendingId)) {
    pendingId = null;
    clearTimeout(pendingTimer);
    pendingTimer = null;

    const messages = SERVICE_MESSAGES[pendingCode];

    if (messages) {
      log(
        d.ok ? messages.accepted : messages.refused,
        !d.ok
      );
    } else if (pendingCode !== 'call') {
      log(
        d.ok
          ? 'Commande acceptée par GSX.'
          : 'Commande refusée par GSX.',
        !d.ok
      );
    }

    pendingCode = null;
  }
}
};

ws.onerror = () => log('Erreur de connexion au serveur GSX.', true);

ws.onclose = () => {
  ready = false;
  running = false;
  pendingId = null;
  clearTimeout(pendingTimer);
  pendingTimer = null;
  ws = null;
  if (active) retry();
  if (S.sm2 === 'gsx') render();
};
  }
    function retry() {
    clearTimeout(reconnectTimer);
    if (active) reconnectTimer = setTimeout(connect, 5000);
  }

  function disconnect() {
    active = false;
    clearTimeout(reconnectTimer);
    if (ws) ws.close();
    ws = null;
    ready = false;
    pendingId = null;
    clearTimeout(pendingTimer);
    pendingTimer = null;
  }

  function service(id) {
    return (mirror.services || []).find(
      x => String(x.id).toLowerCase() === id.toLowerCase()
    ) || null;
  }
function sendCommand(verb, args, code) {
  if (!ws || ws.readyState !== 1 || !ready || !running) {
    log('Action impossible : GSX non connecté ou arrêté.', true);
    return;
  }

  if (pendingId) {
    log('Une commande est déjà en cours.', true);
    return;
  }

  const id = 'turnaround-' + (++commandNo);
  pendingId = id;
  pendingCode = code;

  try {
    ws.send(JSON.stringify({
      type: 'command',
      id,
      verb,
      args: args || {}
    }));

    if (SERVICE_MESSAGES[code]) {
  log(SERVICE_MESSAGES[code].sent, false, 'sent');
}

    pendingTimer = setTimeout(() => {
      if (pendingId === id) {
        pendingId = null;
        pendingTimer = null;
        log('Délai dépassé : aucune réponse de GSX.', true);
      }
    }, 10000);

  } catch (e) {
    pendingId = null;
    clearTimeout(pendingTimer);
    pendingTimer = null;
    log('Erreur d’envoi : ' + e.message, true);
  }
}

function action(code){
  if(code==='call'){
    sendCommand('menu.open',{},'call');
    return;
  }

  const map={
    boarding:['Boarding'],
    deboarding:['Deboarding'],
    fuel:['Refueling'],
    catering:['Catering'],
    stairs:['OperateStairs'],
    jetway:['OperateJetways'],
    gpu:['GPU'],
    pushback:['Departure'],
    cleaning:['Cleaning']
  };

  const ids=map[code];

  if(!ids){
    log('Action inconnue.', true);
    return;
  }

  const target = ids.map(service).find(
  x => x && x.canTrigger !== false
);

  if(!target){
    log('Service indisponible dans son état actuel.', true);
    return;
  }

  sendCommand(
  'service.trigger',
  {service:target.id},
  code
);
}
function menuHtml(){
  const menu=mirror.menu||{};
  const entries=Array.isArray(menu.entries)?menu.entries:[];
  if(!mirror.menuShown||!entries.some(entry=>String(entry||'').trim()))return '';
  return `<div class="piste-gsx-menu"><h3>${esc(menu.title||'Choix demandé par GSX')}</h3>${entries.map((entry,index)=>{
    const label=String(entry||'');
    if(!label.trim())return '';
    const disabled=Array.isArray(menu.disabled)&&menu.disabled[index]===true;
    return `<button type="button" ${disabled?'disabled':''} data-label="${esc(label)}" onclick="GSX.pickMenu(${index},this.dataset.label)">${esc(label)}</button>`;
  }).join('')}</div>`;
}
function pickMenu(index,expectedLabel){
  const menu=mirror.menu||{};
  const entries=Array.isArray(menu.entries)?menu.entries:[];
  const label=entries[index];
  if(!mirror.menuShown||!Number.isInteger(index)||!label||String(label)!==expectedLabel){
    log('Le menu GSX a changé. Attends son actualisation avant de choisir.',true);
    return;
  }
  if(Array.isArray(menu.disabled)&&menu.disabled[index]===true){
    log('Cette option GSX n’est pas disponible.',true);
    return;
  }
  if(!ws||ws.readyState!==1||!ready||!running||pendingId){
    log('Action impossible : GSX non connecté ou une commande est déjà en cours.',true);
    return;
  }
  log('Choix GSX envoyé : '+String(label),false,'sent');
  sendCommand('menu.pick',{index},'menu');
}
  function feedHtml() {
    return messages.length
      ? messages.map(m =>
          `<div class="piste-message ${m.kind||'received'}">
            <span>${esc(m.time)}</span>
            <div>${esc(m.text)}</div>
          </div>`
        ).join('')
      : '<div class="piste-feed-empty"></div>';
  }

  return {
    connect,
    disconnect,
    action,
    menuHtml,
    pickMenu,
    reconnect() {
      disconnect();
      connect();
      
    },
    isReady: () => !!(ready && running && ws && ws.readyState === 1),
    statusText: () => !ws || ws.readyState !== 1
      ? 'Déconnecté'
      : !ready ? 'Connexion en cours…'
      : !running ? 'GSX non démarré'
      : 'Connecté à GSX',
    service,
    feedHtml,
    get mirror() { return mirror; }
  };
})();
</script>
